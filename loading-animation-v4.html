<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Word-cycle Loader</title>
<style>
  :root{
    --bg: #0A0A0A;
    --ink: #F5F5F0;
    --ink-dim: rgba(245,245,240,0.5);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family: 'Arial Narrow', Arial, sans-serif;
  }

  #loader{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
    z-index:50;
  }

  .word-stage{
    display:flex;
    line-height:0.82;
  }

  .word-stage span{
    display:inline-block;
    font-family: Impact, 'Arial Narrow', Arial, sans-serif;
    font-weight:900;
    font-size:clamp(48px, 11vw, 130px);
    color:var(--ink);
    text-transform:uppercase;
    opacity:1;
  }

  .word-stage span.outline{
    color:var(--bg);
    -webkit-text-stroke:2px var(--ink);
    paint-order: stroke fill;
  }

  .progress{
    position:absolute;
    bottom:8%;
    left:50%;
    transform:translateX(-50%);
    font-weight:700;
    font-size:13px;
    letter-spacing:0.18em;
    color:var(--ink-dim);
    text-transform:uppercase;
  }

  #site{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    gap:22px;
    background:var(--bg);
    opacity:0;
    transform:scale(0.94);
    transition:opacity 0.55s ease, transform 0.55s cubic-bezier(.2,.8,.3,1);
    text-align:center;
    padding:20px;
    pointer-events:none;
  }
  #site.visible{ opacity:1; transform:scale(1); pointer-events:auto; }

  #site .logo{
    width:min(46vw, 260px);
    height:auto;
  }

  #replay{
    padding:10px 20px;
    background:transparent;
    color:var(--ink-dim);
    border:1px solid var(--ink-dim);
    border-radius:999px;
    font-weight:700;
    letter-spacing:0.04em;
    cursor:pointer;
    font-size:12px;
  }
  #replay:hover{ color:var(--ink); border-color:var(--ink); }

  @media (prefers-reduced-motion: reduce){
    .word-stage span{ opacity:1 !important; transform:none !important; }
  }
</style>
</head>
<body>

<div id="loader">
  <div class="word-stage" id="stage"></div>
  <div class="progress" id="progress">Loading — 1 / 3</div>
</div>

<div id="site">
  <svg class="logo" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
    <defs>

        .cls-3 { stroke: #fff; stroke-miterlimit: 10; stroke-width: 2px; }
      </style>
    </defs>

    <path d="M864.1,624.5v-45.72c0,53.77-31.7,83.05-85.62,83.05h-27.96v.16h76.15c20.66,0,37.43-16.79,37.43-37.49Z"/>

  </svg>
  <button id="replay">Replay animation</button>
</div>

<script>
(function(){
  var WORDS = ["DOE MEE", "ONTMOET", "GROEI"];
  var OUTLINE_LAST_N = 2;

  // Faster timings
  var LETTER_STAGGER = 28;   // was 55
  var HOLD_TIME = 280;       // was 600
  var EXIT_STAGGER = 18;     // was 35
  var LETTER_IN_DUR = 260;   // was 420
  var LETTER_OUT_DUR = 160;  // was 260

  var stage = document.getElementById('stage');
  var progress = document.getElementById('progress');
  var loader = document.getElementById('loader');
  var site = document.getElementById('site');

  var IN_KEYFRAMES = [
    { transform: 'translateY(14px)', opacity: 0 },
    { transform: 'translateY(0px)', opacity: 1 }
  ];

  var OUT_KEYFRAMES = [
    { transform: 'translateY(0px)', opacity: 1 },
    { transform: 'translateY(-14px)', opacity: 0 }
  ];

  function buildWord(word){
    stage.innerHTML = '';
    var letters = word.split('');
    var spans = [];
    letters.forEach(function(ch, i){
      var span = document.createElement('span');
      span.textContent = (ch === ' ') ? '\u00A0\u00A0' : ch;
      if (i >= letters.length - OUTLINE_LAST_N && ch !== ' ') {
        span.classList.add('outline');
      }
      stage.appendChild(span);
      spans.push(span);
    });
    return spans;
  }

  function animateIn(spans){
    return new Promise(function(resolve){
      var maxEnd = 0;
      spans.forEach(function(el, i){
        var delay = i * LETTER_STAGGER;
        el.style.opacity = '0';
        try {
          el.animate(IN_KEYFRAMES, {
            duration: LETTER_IN_DUR,
            delay: delay,
            easing: 'cubic-bezier(.2,.8,.3,1)',
            fill: 'forwards'
          });
        } catch(e) {
          el.style.opacity = '1';
        }
        maxEnd = Math.max(maxEnd, delay + LETTER_IN_DUR);
      });
      setTimeout(resolve, maxEnd);
    });
  }

  function animateOut(spans){
    return new Promise(function(resolve){
      var maxEnd = 0;
      spans.forEach(function(el, i){
        var delay = i * EXIT_STAGGER;
        try {
          el.animate(OUT_KEYFRAMES, {
            duration: LETTER_OUT_DUR,
            delay: delay,
            easing: 'cubic-bezier(.6,0,.9,.3)',
            fill: 'forwards'
          });
        } catch(e) {
          el.style.opacity = '0';
        }
        maxEnd = Math.max(maxEnd, delay + LETTER_OUT_DUR);
      });
      setTimeout(resolve, maxEnd);
    });
  }

  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  function runSequence(){
    loader.style.display = 'flex';
    loader.style.opacity = '1';
    site.classList.remove('visible');

    var chain = Promise.resolve();
    WORDS.forEach(function(word, i){
      chain = chain.then(function(){
        progress.textContent = 'Loading — ' + (i + 1) + ' / ' + WORDS.length;
        var spans = buildWord(word);
        return animateIn(spans).then(function(){
          return wait(HOLD_TIME);
        }).then(function(){
          return animateOut(spans);
        });
      });
    });

    chain.then(function(){
      loader.style.transition = 'opacity 0.4s ease';
      loader.style.opacity = '0';
      return wait(400);
    }).then(function(){
      loader.style.display = 'none';
      site.classList.add('visible');
    });
  }

  document.getElementById('replay').addEventListener('click', runSequence);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', runSequence);
  } else {
    runSequence();
  }
})();
</script>

</body>
</html>
